; .user.ini — per-directory PHP limits for this staging subtree.
;
; WHY THIS MECHANISM AND NOT ANOTHER (RESEARCH P-5). upload_max_filesize and
; post_max_size are INI_PERDIR. Under FastCGI — which 04-HOST-CAPABILITIES
; measures as this host's SAPI (`sapi : cgi-fcgi`) — a php_value line in
; .htaccess is not an ignored directive, it is a 500 for the entire subtree,
; and .user.ini is the mechanism that does work. The final probe also measures
; `user_ini.filename : '.user.ini'`, so this file is read. Both conditions were
; checked before it was written; neither was assumed.
;
; THESE VALUES TIGHTEN THE HOST, THEY DO NOT RAISE IT — and that is the
; opposite of what the plan expected, for a reason worth recording. The plan
; was written against a measured 2M/8M ceiling on PHP 5.2, where 10 MB photos
; were impossible. The account-default switch in 04-01 moved this directory to
; 8.5 and its ini, which measures 250M/200M in effect. The ceiling D4-13 fought
; is gone; what is left is the opposite problem — an endpoint that will buffer
; a 200 MB request body from any stranger who sends one.
;
; upload_max_filesize matches the form's own copy exactly («всяка до 10 MB»),
; so PHP refuses an oversized photo at the SAPI boundary with UPLOAD_ERR_INI_SIZE
; before a single byte reaches the pipeline in includes/upload.php. The copy
; never advertises a limit the server does not honour, and now the server never
; accepts one the copy does not advertise either.
;
; post_max_size is 60M and NOT 50M. PHP discards the ENTIRE $_POST when this is
; exceeded — $_POST and $_FILES both arrive empty, with no error the handler can
; see — so it has to clear five maximum-sized photographs (50 MB) plus the
; multipart framing and the six text fields, with room left over. Sizing it at
; exactly the sum is how a submission at the advertised limit becomes a blank
; form and an unexplainable bug report. contact-send.php detects the emptied
; $_POST explicitly anyway, so the failure is honest even if this is ever wrong.
;
; max_file_uploads IS DELIBERATELY ABSENT. It is INI_SYSTEM: it cannot be set
; from .user.ini or .htaccess at all, only from php.ini. Its default of 20 is
; measured in effect and comfortably clears five photographs. Adding a line for
; it here would be silently ignored and would read, to the next person, as a
; limit that had been configured.
;
; RE-MEASURING AFTER A CHANGE: user_ini.cache_ttl is measured at 300 seconds.
; Deploy, wait out the window, and only then probe — re-testing immediately
; reads the OLD value and records it as the new one.
;
; SERVED OVER HTTP UNTIL 04-06. This file is fetchable at its own URL until
; 04-06 adds the settings-file deny block to .htaccess; that block owns the
; <FilesMatch> rule for this name, and it is not added here because 04-06 owns
; that part of the file. Nothing below names an absolute server path, for
; exactly that reason.

upload_max_filesize = 10M
post_max_size = 60M
