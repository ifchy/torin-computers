<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Laptop optimization icon</title>
  <desc>Minimal flat vector icon of a laptop being optimized, using blue and orange on a transparent background.</desc>

  <!-- Laptop screen -->
  <rect x="92" y="72" width="328" height="252" rx="22" fill="#0547dc"/>
  <rect x="113" y="93" width="286" height="210" rx="8"
        fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="12"/>

  <!-- Webcam -->
  <circle cx="256" cy="84" r="4" fill="#fff"/>

  <!-- Optimization graph / performance bars -->
  <g fill="#fff">
    <rect x="145" y="238" width="30" height="34" rx="5"/>
    <rect x="190" y="214" width="30" height="58" rx="5"/>
    <rect x="235" y="184" width="30" height="88" rx="5"/>
    <rect x="280" y="154" width="30" height="118" rx="5"/>
  </g>

  <!-- Upward optimization arrow -->
  <path d="M155 198 L216 151 L259 166 L330 119"
        fill="none" stroke="#fbad03" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M301 116 H334 V149"
        fill="none" stroke="#fbad03" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small sparkle / optimization accent -->
  <path d="M354 178 L361 194 L377 201 L361 208 L354 225 L347 208 L331 201 L347 194 Z"
        fill="#fbad03"/>

  <!-- Laptop base -->
  <path d="M82 335
           Q88 323 103 323
           H409
           Q424 323 430 335
           L470 420
           Q476 434 461 434
           H51
           Q36 434 42 420 Z"
        fill="#0547dc"/>

  <!-- Keyboard -->
  <g fill="#fff" opacity=".96">
    <rect x="112" y="343" width="42" height="18" rx="4"/>
    <rect x="161" y="343" width="42" height="18" rx="4"/>
    <rect x="210" y="343" width="42" height="18" rx="4"/>
    <rect x="259" y="343" width="42" height="18" rx="4"/>
    <rect x="308" y="343" width="42" height="18" rx="4"/>
    <rect x="357" y="343" width="42" height="18" rx="4"/>

    <rect x="104" y="369" width="50" height="18" rx="4"/>
    <rect x="161" y="369" width="50" height="18" rx="4"/>
    <rect x="218" y="369" width="50" height="18" rx="4"/>
    <rect x="275" y="369" width="50" height="18" rx="4"/>
    <rect x="332" y="369" width="50" height="18" rx="4"/>
    <rect x="389" y="369" width="18" height="18" rx="4"/>

    <rect x="111" y="395" width="52" height="14" rx="4"/>
    <rect x="170" y="395" width="172" height="14" rx="4"/>
    <rect x="349" y="395" width="52" height="14" rx="4"/>
  </g>

  <!-- Trackpad -->
  <rect x="222" y="410" width="68" height="12" rx="5" fill="#fbad03"/>
</svg>
